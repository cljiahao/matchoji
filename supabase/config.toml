# Supabase CLI configuration for a local stack: `supabase start` runs every migration and then
# the seeds below, so `pnpm dev` works against localhost without production keys. Values not set
# here take the CLI's defaults.
project_id = "matchoji"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
# Filename order: the teas first, then their grades, regions' supply, stats and shop links.
sql_paths = ["./seed/*.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# Google sign-in locally needs your own OAuth client; the IDs are read from the environment.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[storage]
enabled = true
