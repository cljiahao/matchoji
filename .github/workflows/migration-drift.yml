name: Migration drift
# Fails when supabase/migrations/ holds a migration the hosted project has not recorded as
# applied. Migrations are run by hand, so on a PR this blocks merging (and Vercel deploying)
# code ahead of its schema; the daily run catches anything applied to the wrong project.
# Needs the SUPABASE_ACCESS_TOKEN repository secret; without it the check is skipped, not failed
# (Dependabot and fork PRs never see secrets).
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
  schedule: [{ cron: "17 1 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: migration-drift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The project ref is public: it is in every page's Supabase URL.
      SUPABASE_PROJECT_REF: skajpelucxgovxajlzvo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with: { node-version: "24" }
      - name: compare migrations with the hosted project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/check-migration-drift.mjs
      - name: skipped without the access token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::SUPABASE_ACCESS_TOKEN is not set; migration drift was not checked."
