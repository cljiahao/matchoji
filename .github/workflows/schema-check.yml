name: Schema check
# Compares the live Supabase database with the repo: every file in supabase/migrations/ must be
# applied (and the reverse), and database.types.ts must match `supabase gen types`. It connects
# with a read-only, project-scoped Postgres role (secret SUPABASE_DB_URL), never a Supabase
# account token. Without the secret (forks, unset) the job skips cleanly. Setup: docs/schema-checks.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/integrations/supabase/database.types.ts"
      - "scripts/schema-check.ts"
      - ".github/workflows/schema-check.yml"
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: schema-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: skip without SUPABASE_DB_URL
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: echo "::notice::schema-check skipped, the SUPABASE_DB_URL secret is not available (see docs/schema-checks.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SUPABASE_DB_URL != '' }}
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0 — reads packageManager from package.json
        if: ${{ env.SUPABASE_DB_URL != '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.SUPABASE_DB_URL != '' }}
        with: { node-version: "24.22.1", cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: ${{ env.SUPABASE_DB_URL != '' }}
      - name: migrations applied and types fresh
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: pnpm schema:check
