name: Build
# A production build with the Supabase vars blank, the way Vercel Preview builds. It catches
# pages Next tries to prerender at build time (they hit the "Supabase is not configured"
# guard) before they reach Vercel, which twice failed a deploy that every other check passed.
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The build runs third-party code (install scripts, next build); it needs no token.
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — reads packageManager from package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: next build without Supabase env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
