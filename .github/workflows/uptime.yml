name: Uptime
# A free uptime monitor with no provider account: every 15 minutes, check the live health
# endpoint (which also asks the database) and the home page. A failed run makes GitHub email
# whoever last changed this schedule. GitHub may delay scheduled runs by several minutes, and
# pauses them after 60 days without repository activity.
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE: https://matchoji.vercel.app
    steps:
      - name: health endpoint answers ok
        run: |
          body=$(curl -sS --fail-with-body --retry 2 --retry-all-errors --max-time 20 "$SITE/api/health")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
      - name: home page loads
        run: curl -sS --fail --retry 2 --retry-all-errors --max-time 20 -o /dev/null "$SITE/"
